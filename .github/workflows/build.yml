name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Giai nen
        run: unzip -q ./*.zip -d app
      - name: Tao du an Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          python3 native/setup.py
      - name: Doi icon
        working-directory: app
        run: |
          if [ -f ../icon.png ]; then
            mkdir -p assets
            cp ../icon.png assets/icon-only.png
            cp ../icon.png assets/icon-foreground.png
            npx @capacitor/assets generate --android --iconBackgroundColor '#7a1410' --iconBackgroundColorDark '#7a1410'
          fi
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Dang APK len Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lich Viet ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
